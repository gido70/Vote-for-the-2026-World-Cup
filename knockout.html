<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>الأدوار الإقصائية | توقعات كأس العالم 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--pitch-dark:#071f16;--pitch-line:#1c5d46;--gold:#ffcc33;--gold-deep:#b9861a;--chalk:#f5f1e6;--chalk-dim:#cfc9b8;--red:#e2483d;--green-ok:#2fbf71;--card:#0e2a1f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent} body{margin:0;font-family:Tajawal,sans-serif;color:var(--chalk);background:radial-gradient(ellipse at 50% -10%,#113a27 0%,var(--pitch-dark) 58%)}
#app{max-width:520px;margin:0 auto;padding:18px 16px 70px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px}.brand{font-weight:900;color:var(--gold);font-size:15px}
.navbtn{background:transparent;border:1px solid var(--pitch-line);color:var(--chalk-dim);font-family:Tajawal;font-size:12px;padding:7px 11px;border-radius:20px;text-decoration:none;cursor:pointer}
.banner{font-size:12px;text-align:center;color:var(--chalk-dim);background:var(--card);border:1px solid var(--pitch-line);border-radius:12px;padding:10px;margin-bottom:14px;line-height:1.8}
.hero{border:2px solid rgba(255,204,51,.7);border-radius:18px;padding:14px;background:linear-gradient(180deg,rgba(255,204,51,.14),rgba(14,42,31,.96));margin-bottom:14px;text-align:center}.hero h1{font-size:20px;margin:0 0 8px;color:var(--gold)}.hero p{font-size:12.5px;color:var(--chalk-dim);line-height:1.8;margin:0}
.round-header{display:flex;align-items:center;gap:8px;margin:20px 0 10px}.round-header .lbl{font-size:13px;font-weight:900;color:var(--gold);white-space:nowrap}.round-header .line{flex:1;height:1px;background:var(--pitch-line)}
.match-card{background:var(--card);border:1px solid var(--pitch-line);border-radius:16px;padding:14px;margin-bottom:10px}.match-meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:11px;color:var(--chalk-dim);margin-bottom:10px}
.team-line{display:flex;align-items:center;gap:10px;background:#0a2419;border:1px solid var(--pitch-line);border-radius:12px;padding:10px;margin:6px 0}.team-line .flag{font-size:21px}.team-line .name{flex:1;font-weight:800}
.score-grid{display:grid;grid-template-columns:1fr 64px;gap:8px;align-items:center;margin-top:10px}.score-grid input,input[type=text]{width:100%;padding:10px;border-radius:10px;border:1px solid var(--pitch-line);background:#082318;color:var(--chalk);font-family:Oswald;font-size:17px;text-align:center}
.btn{display:block;width:100%;padding:12px 14px;border-radius:12px;border:none;font-family:Tajawal;font-weight:900;font-size:14px;cursor:pointer;margin-top:10px}.btn-gold{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#1a1200}.btn-outline{background:transparent;border:1px solid var(--pitch-line);color:var(--chalk)}
.note{font-size:11.5px;color:var(--chalk-dim);text-align:center;line-height:1.7;margin-top:8px}.pill{display:inline-block;border:1px solid var(--pitch-line);border-radius:999px;padding:3px 8px;font-size:10.5px;color:var(--chalk-dim)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1200;font-weight:800;font-size:13px;padding:10px 18px;border-radius:30px;z-index:1000;opacity:0;transition:.25s;max-width:90%;text-align:center}.toast.show{opacity:1;bottom:30px}
.pin-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px}.pin-box{background:var(--card);border:1px solid var(--pitch-line);border-radius:16px;padding:20px;width:100%;max-width:320px}
.lb-row{display:flex;align-items:center;gap:9px;background:var(--card);border:1px solid var(--pitch-line);border-radius:14px;padding:11px;margin-bottom:8px}.lb-rank{color:var(--gold);font-weight:900;width:28px;text-align:center}.lb-name{flex:1;font-weight:800}.lb-score{font-family:Oswald;font-weight:900;color:var(--gold)}
.vote-summary{margin-top:10px;padding-top:10px;border-top:1px dashed var(--pitch-line)}.vote-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--chalk-dim);margin-bottom:5px;gap:6px}.vote-row b{color:var(--chalk)}.vote-track{display:flex;height:12px;border-radius:7px;overflow:hidden;background:#0a2419;border:1px solid var(--pitch-line)}.vote-fill-a{background:linear-gradient(90deg,var(--gold-deep),var(--gold))}.vote-fill-b{background:linear-gradient(90deg,#2f6fbf,#5a9ae0)}.vote-total{font-size:10px;color:var(--chalk-dim);text-align:center;margin-top:5px;opacity:.8}
.hof-hero{text-align:center;padding:22px 14px;margin-bottom:14px;border-radius:16px;background:radial-gradient(ellipse at top,rgba(255,204,51,.22),rgba(14,42,31,.98));border:2px solid rgba(255,204,51,.6)}.hof-hero-title{font-family:Oswald;font-size:22px;font-weight:900;color:var(--gold)}.hof-hero-sub{font-size:12px;color:var(--chalk-dim);margin-top:6px}.hof-section{margin-bottom:14px}.hof-section-title{font-weight:900;color:var(--gold);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-size:14px}.hof-count{font-size:10.5px;color:var(--chalk-dim);font-weight:600}.hof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.hof-badge{background:linear-gradient(160deg,rgba(255,204,51,.18),var(--card));border:1.5px solid var(--gold);border-radius:14px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}.hof-medal{font-size:22px}.hof-badge-name{font-weight:800;font-size:12.5px;color:var(--chalk)}.hof-badge-sub{font-size:10px;color:var(--gold)}
</style>
</head>
<body>
<div id="app"></div><div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<script>
const SUPABASE_READY=!!(window.WC_SUPABASE_CONFIG&&window.WC_SUPABASE_CONFIG.url&&window.WC_SUPABASE_CONFIG.anonKey&&!window.WC_SUPABASE_CONFIG.url.includes('PUT_'));
const sb=SUPABASE_READY?window.supabase.createClient(window.WC_SUPABASE_CONFIG.url,window.WC_SUPABASE_CONFIG.anonKey):null;
async function sset(k,v){if(!sb)return false;const{error}=await sb.from('wc_store').upsert({k:k,v:v,updated_at:new Date().toISOString()},{onConflict:'k'});if(error){console.error(error);return false}return true}
async function sget(k){if(!sb)return null;const{data,error}=await sb.from('wc_store').select('v').eq('k',k).maybeSingle();if(error){console.error(error);return null}return data?data.v:null}
async function slist(prefix){if(!sb)return null;const{data,error}=await sb.from('wc_store').select('k').like('k',prefix+'%');if(error){console.error(error);return null}return(data||[]).map(x=>x.k)}
async function getAllPredictions(prefix){if(!sb)return[];const{data,error}=await sb.rpc('get_predictions',{prefix});if(error){console.error('getAllPredictions',error);return[]}return(data||[]).map(row=>row.v)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(m){const t=document.querySelector('.toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function normalizeName(r){return r.trim().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[إأآا]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').toLowerCase()}
const TEAMS={PAR:{name:'باراغواي',flag:'🇵🇾'},FRA:{name:'فرنسا',flag:'🇫🇷'},CAN:{name:'كندا',flag:'🇨🇦'},MAR:{name:'المغرب',flag:'🇲🇦'},POR:{name:'البرتغال',flag:'🇵🇹'},ESP:{name:'إسبانيا',flag:'🇪🇸'},USA:{name:'أمريكا',flag:'🇺🇸'},BEL:{name:'بلجيكا',flag:'🇧🇪'},BRA:{name:'البرازيل',flag:'🇧🇷'},NOR:{name:'النرويج',flag:'🇳🇴'},MEX:{name:'المكسيك',flag:'🇲🇽'},ENG:{name:'إنجلترا',flag:'🏴'},ARG:{name:'الأرجنتين',flag:'🇦🇷'},EGY:{name:'مصر',flag:'🇪🇬'},SUI:{name:'سويسرا',flag:'🇨🇭'},COL:{name:'كولومبيا',flag:'🇨🇴'}};
const KO=[
{id:'qf1',round:1,label:'ربع النهائي 1',feedA:'m1',feedB:'m2',kickoff:'2026-07-09T20:00:00Z',venue:'فوكسبورو (بوسطن)'},
{id:'qf2',round:1,label:'ربع النهائي 2',feedA:'m3',feedB:'m4',kickoff:'2026-07-10T19:00:00Z',venue:'إنجلوود (لوس أنجلوس)'},
{id:'qf3',round:1,label:'ربع النهائي 3',feedA:'m5',feedB:'m6',kickoff:'2026-07-11T21:00:00Z',venue:'ميامي غاردنز'},
{id:'qf4',round:1,label:'ربع النهائي 4',feedA:'m7',feedB:'m8',kickoff:'2026-07-12T01:00:00Z',venue:'كانساس سيتي'},
{id:'sf1',round:2,label:'نصف النهائي 1',feedA:'qf1',feedB:'qf2',kickoff:'2026-07-14T19:00:00Z',venue:'أرلينغتون'},
{id:'sf2',round:2,label:'نصف النهائي 2',feedA:'qf3',feedB:'qf4',kickoff:'2026-07-15T19:00:00Z',venue:'أتلانتا'},
{id:'final',round:3,label:'النهائي',feedA:'sf1',feedB:'sf2',kickoff:'2026-07-19T19:00:00Z',venue:'نيوجيرسي'}];
const ROUND_LABELS={1:'دور الثمانية',2:'دور الأربعة',3:'النهائي'},ROUND_WEIGHTS={1:2,2:4,3:8},EXACT_BONUS=2,LOCK_MINUTES_BEFORE=5,ADMIN_PIN=(window.WC_SUPABASE_CONFIG&&window.WC_SUPABASE_CONFIG.adminPin)||'QX742';
let state={name:'',nameKey:''};const $app=document.getElementById('app');
async function getActual(){return(await sget('actual-results'))||{}} async function getScores(){return(await sget('ko-actual-scores'))||{}} async function getMyPicks(){const p=await sget('ko-predictions:'+state.nameKey);return p?p.picks||{}:{}}
function resolved(actual,m,side){const f=side==='a'?m.feedA:m.feedB;return actual[f]||null}
function localTimeStr(iso){return new Date(iso).toLocaleString('ar',{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function winnerFromScore(a,b,sa,sb){const x=parseInt(sa,10),y=parseInt(sb,10);if(Number.isNaN(x)||Number.isNaN(y))return null;if(x>y)return a;if(y>x)return b;return null}
function phase(actual,m){const a=resolved(actual,m,'a'),b=resolved(actual,m,'b');if(!a||!b)return'pending';if(actual[m.id])return'finished';return Date.now()>=new Date(m.kickoff).getTime()-LOCK_MINUTES_BEFORE*60000?'locked':'open'}
async function askPin(){return new Promise(res=>{const o=document.createElement('div');o.className='pin-overlay';o.innerHTML='<div class="pin-box"><label style="display:block;margin-bottom:8px;color:var(--chalk-dim);font-size:13px">أدخل رمز المشرف</label><input id="pinInput" type="text" style="width:100%;padding:12px;border-radius:10px;border:1px solid var(--pitch-line);background:#0a2419;color:var(--chalk);font-size:16px;margin-bottom:12px;font-family:Tajawal"><div style="display:flex;gap:8px"><button id="pinCancel" style="flex:1;padding:10px;border-radius:10px;border:1px solid var(--pitch-line);background:transparent;color:var(--chalk);font-family:Tajawal">إلغاء</button><button id="pinOk" style="flex:1;padding:10px;border-radius:10px;border:none;background:var(--gold);color:#1a1200;font-weight:900;font-family:Tajawal">تأكيد</button></div></div>';document.body.appendChild(o);const i=o.querySelector('#pinInput');setTimeout(()=>i.focus(),40);function c(r){document.body.removeChild(o);res(r)}o.querySelector('#pinCancel').onclick=()=>c(false);o.querySelector('#pinOk').onclick=()=>c(i.value===ADMIN_PIN);i.addEventListener('keydown',e=>{if(e.key==='Enter')c(i.value===ADMIN_PIN)})})}
function shell(title,body){$app.innerHTML='<div class="topbar"><a class="navbtn" href="./index.html">‹ الرئيسية</a><div class="brand">'+title+'</div><button class="navbtn" id="adminBtn">🔒 المشرف</button></div>'+body;document.getElementById('adminBtn').onclick=async()=>{if(await askPin())renderAdmin();else toast('رمز غير صحيح')}}
async function init(){if(!SUPABASE_READY){$app.innerHTML='<div class="banner">لم يتم ضبط Supabase.</div>';return}const key=localStorage.getItem('wc2026-player-key');if(key){const ident=await sget('identity:'+key);if(ident&&ident.name){state.name=ident.name;state.nameKey=key}}renderHome()}
async function renderHome(){if(!state.name){shell('🏆 الأدوار الإقصائية','<div class="hero"><h1>دور الثمانية وما بعده</h1><p>صفحة مستقلة وآمنة. دور الـ16 لا يتغير.</p></div><div class="banner">اكتب نفس اسمك المستخدم في التصويت السابق.</div><div class="match-card"><input type="text" id="nameInput" placeholder="اسمك"><button class="btn btn-gold" id="startBtn">ابدأ</button></div>');document.getElementById('startBtn').onclick=async()=>{const v=document.getElementById('nameInput').value.trim();if(!v){toast('اكتب اسمك');return}const key=normalizeName(v);localStorage.setItem('wc2026-player-key',key);let ident=await sget('identity:'+key);if(!ident){await sset('identity:'+key,{name:v,registeredAt:Date.now()});ident={name:v}}state.name=ident.name||v;state.nameKey=key;renderHome()};return}
const actual=await getActual(),scores=await getScores(),picks=await getMyPicks();const allPreds=await getAllPredictions('ko-predictions:');function voteBarHtml(matchId,a,b){const ta=TEAMS[a],tb=TEAMS[b];let ca=0,cb=0;allPreds.forEach(p=>{const pk=p.picks&&p.picks[matchId];if(pk){if(pk.winner===a)ca++;else if(pk.winner===b)cb++}});const total=ca+cb,pa=total?Math.round(ca/total*100):50,pb=total?100-pa:50;return '<div class="vote-summary"><div class="vote-row"><span>'+ta.flag+' '+ta.name+' <b>'+pa+'%</b></span><span><b>'+pb+'%</b> '+tb.name+' '+tb.flag+'</span></div><div class="vote-track"><div class="vote-fill-a" style="width:'+pa+'%"></div><div class="vote-fill-b" style="width:'+pb+'%"></div></div><div class="vote-total">'+(total?('👥 '+total+' صوّتوا حتى الآن'):'لا توجد أصوات بعد')+'</div></div>'}let html='<div class="hero"><h1>مرحباً '+escapeHtml(state.name)+'</h1><p>من دور الثمانية يكون التصويت بالنتيجة. اكتب نتيجة الفريقين ثم احفظ. الفائز ينتقل تلقائياً بعد اعتماد المشرف.</p></div><button class="btn btn-outline" id="lbBtn">📊 ترتيب الإقصائيات</button>';let last=0;
for(const m of KO){if(m.round!==last){html+='<div class="round-header"><span class="lbl">'+ROUND_LABELS[m.round]+'</span><div class="line"></div></div>';last=m.round}const ph=phase(actual,m),a=resolved(actual,m,'a'),b=resolved(actual,m,'b'),pick=picks[m.id],win=actual[m.id];html+='<div class="match-card"><div class="match-meta"><span>'+m.label+' · '+m.venue+'</span><span class="pill">'+localTimeStr(m.kickoff)+'</span></div>';if(!a||!b){const slot=code=>code?('<div class="team-line"><span class="flag">'+TEAMS[code].flag+'</span><span class="name">'+TEAMS[code].name+'</span><span class="pill" style="margin-right:auto">متأهل ✅</span></div>'):('<div class="team-line" style="opacity:.45"><span class="flag">❔</span><span class="name">بانتظار الفريق المتأهل</span></div>');html+=slot(a)+slot(b)+'<div class="note">'+((a||b)?('✅ تأهل <b>'+TEAMS[a||b].name+'</b> لهذه المباراة تلقائيًا — بانتظار الفريق الثاني من مباراته.'):'بانتظار نتائج الدور السابق لتحديد طرفي هذه المباراة.')+'</div>'}else{const ta=TEAMS[a],tb=TEAMS[b];html+='<div class="team-line"><span class="flag">'+ta.flag+'</span><span class="name">'+ta.name+'</span></div><div class="team-line"><span class="flag">'+tb.flag+'</span><span class="name">'+tb.name+'</span></div>';if(win){const sc=scores[m.id]||{},good=pick&&pick.winner===win,exact=pick&&String(pick.a)===String(sc.a)&&String(pick.b)===String(sc.b);html+='<div class="banner">'+TEAMS[win].flag+' الفائز الرسمي: <b>'+TEAMS[win].name+'</b><br>'+(pick?(good?('🎉 توقعك للفائز صحيح '+(exact?'والنتيجة دقيقة 🎯':'')):'❌ توقعك لم يصب. حظاً أوفر.'):'لم تشارك في هذه المباراة.')+'</div>'}else if(ph==='locked'){html+='<div class="banner">⏳ أُغلق التصويت. بانتظار اعتماد النتيجة الرسمية من المشرف.</div>'+(pick?'<div class="note">توقعك المحفوظ: '+pick.a+' - '+pick.b+'</div>':'')}else if(pick){html+='<div class="banner">✅ تم حفظ توقعك تلقائيًا: '+pick.a+' - '+pick.b+'<br>لا يوجد زر إرسال، ولا يمكن التعديل بعد الحفظ.</div>'}else{html+='<div class="score-grid"><div>'+ta.flag+' '+ta.name+'</div><input type="number" min="0" id="'+m.id+'_a" placeholder="0"><div>'+tb.flag+' '+tb.name+'</div><input type="number" min="0" id="'+m.id+'_b" placeholder="0"></div><button class="btn btn-gold save-pick" data-id="'+m.id+'" data-a="'+a+'" data-b="'+b+'">حفظ التوقع</button><div class="note">📌 اكتب النتيجة. عند الحفظ لا يمكن تعديلها. إذا انتهت بالتعادل استخدم نتيجة الترجيح التي تحدد الفائز.</div>'}html+=voteBarHtml(m.id,a,b)}html+='</div>'}
shell('🏆 الأدوار الإقصائية',html);document.getElementById('lbBtn').onclick=renderLeaderboard;document.querySelectorAll('.save-pick').forEach(btn=>btn.onclick=async()=>{const id=btn.dataset.id,a=btn.dataset.a,b=btn.dataset.b,va=document.getElementById(id+'_a').value,vb=document.getElementById(id+'_b').value,w=winnerFromScore(a,b,va,vb);if(!w){toast('اكتب نتيجة تحدد الفائز.');return}const cur=await sget('ko-predictions:'+state.nameKey)||{name:state.name,key:state.nameKey,picks:{}};cur.picks=cur.picks||{};if(cur.picks[id]){toast('لديك توقع محفوظ');return}cur.picks[id]={a:va,b:vb,winner:w,savedAt:Date.now()};await sset('ko-predictions:'+state.nameKey,cur);toast('✅ تم حفظ توقعك تلقائيًا.');renderHome()})}
async function renderLeaderboard(){const actual=await getActual(),scores=await getScores(),people=await getAllPredictions('ko-predictions:');const rows=people.map(p=>{let pts=0,correct=0,wrong=0,voted=0,exact=0,perRound={1:{c:0,d:0},2:{c:0,d:0},3:{c:0,d:0}};for(const m of KO){const pick=p.picks&&p.picks[m.id],res=actual[m.id];if(res){perRound[m.round].d++}if(res&&pick){voted++;if(pick.winner===res){correct++;perRound[m.round].c++;pts+=ROUND_WEIGHTS[m.round]||0;const sc=scores[m.id];if(sc&&String(sc.a)===String(pick.a)&&String(sc.b)===String(pick.b)){exact++;pts+=EXACT_BONUS}}else wrong++}}const acc=(correct+wrong)?Math.round(correct/(correct+wrong)*100):0;return{name:p.name,pts,correct,wrong,voted,exact,acc,perRound}}).sort((a,b)=>(b.pts-a.pts)||(b.correct-a.correct)||(b.voted-a.voted)||(b.acc-a.acc));
let html='<div class="hof-hero"><div class="hof-hero-title">🏅 قائمة الأبطال</div><div class="hof-hero-sub">مَن حصلوا على الدرجة الكاملة في كل دور — تُحدَّث تلقائيًا</div></div>';
[1,2,3].forEach(r=>{const perfect=rows.filter(x=>x.perRound[r].d>0&&x.perRound[r].c===x.perRound[r].d);const decided=KO.filter(m=>m.round===r&&actual[m.id]).length;const totalInRound=KO.filter(m=>m.round===r).length;html+='<div class="hof-section"><div class="hof-section-title">'+(r===1?'⚽':r===2?'🔥':'🏆')+' '+ROUND_LABELS[r]+' <span class="hof-count">'+decided+' من '+totalInRound+' محسومة</span></div>';if(decided===0){html+='<div class="note">لم تُحسم أي مباراة في هذا الدور بعد.</div>'}else if(perfect.length===0){html+='<div class="note">لا يوجد حتى الآن من حقّق الدرجة الكاملة في هذا الدور.</div>'}else{html+='<div class="hof-grid">'+perfect.map(p=>'<div class="hof-badge"><span class="hof-medal">🏅</span><span class="hof-badge-name">'+escapeHtml(p.name)+'</span><span class="hof-badge-sub">'+p.perRound[r].c+'/'+decided+' صحيح</span></div>').join('')+'</div>'}html+='</div>'});
html+='<div class="banner">ترتيب دور الثمانية وما بعده يحسب بعد اعتماد نتائج المباريات من المشرف.</div>';rows.forEach((r,i)=>{const med=i===0?'🥇':i===1?'🥈':i===2?'🥉':i+1;html+='<div class="lb-row"><div class="lb-rank">'+med+'</div><div class="lb-name">'+escapeHtml(r.name)+'<div class="note" style="text-align:right">شارك: '+r.voted+' · صحيح: '+r.correct+' · خطأ: '+r.wrong+' · دقيقة: '+r.exact+' · دقة: '+r.acc+'%</div></div><div class="lb-score">'+r.pts+'</div></div>'});shell('📊 ترتيب الإقصائيات',html)}
async function renderAdmin(){const actual=await getActual(),scores=await getScores();let html='<div class="banner">اعتماد نتائج الأدوار الإقصائية. الفائز ينتقل تلقائيًا للدور التالي.</div>';for(const m of KO){const a=resolved(actual,m,'a'),b=resolved(actual,m,'b');html+='<div class="match-card"><div class="match-meta"><span>'+m.label+'</span><span>'+m.venue+'</span></div>';if(!a||!b){html+='<div class="note">بانتظار اكتمال طرفي المباراة.</div>'}else{const sc=scores[m.id]||{};html+='<div class="score-grid"><div>'+TEAMS[a].flag+' '+TEAMS[a].name+'</div><input type="number" min="0" id="admin_'+m.id+'_a" value="'+(sc.a??'')+'" placeholder="0"><div>'+TEAMS[b].flag+' '+TEAMS[b].name+'</div><input type="number" min="0" id="admin_'+m.id+'_b" value="'+(sc.b??'')+'" placeholder="0"></div><button class="btn btn-gold admin-save" data-id="'+m.id+'" data-a="'+a+'" data-b="'+b+'">اعتماد النتيجة</button><div class="note">'+(actual[m.id]?'الفائز المعتمد: '+TEAMS[actual[m.id]].name:'لم تعتمد النتيجة بعد.')+'</div>'}html+='</div>'}shell('🔒 مشرف الإقصائيات',html);document.querySelectorAll('.admin-save').forEach(btn=>btn.onclick=async()=>{const id=btn.dataset.id,a=btn.dataset.a,b=btn.dataset.b,va=document.getElementById('admin_'+id+'_a').value,vb=document.getElementById('admin_'+id+'_b').value,w=winnerFromScore(a,b,va,vb);if(!w){toast('اكتب نتيجة تحدد الفائز.');return}const actual=await getActual(),scores=await getScores();actual[id]=w;scores[id]={a:va,b:vb,winner:w,savedAt:Date.now()};await sset('actual-results',actual);await sset('ko-actual-scores',scores);toast('✅ تم اعتماد النتيجة ونقل الفائز.');renderAdmin()})}
