<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script>
<script>
const SUPABASE_READY=!!(window.WC_SUPABASE_CONFIG&&window.WC_SUPABASE_CONFIG.url&&window.WC_SUPABASE_CONFIG.anonKey&&!window.WC_SUPABASE_CONFIG.url.includes('PUT_'));
const sb=SUPABASE_READY?window.supabase.createClient(window.WC_SUPABASE_CONFIG.url,window.WC_SUPABASE_CONFIG.anonKey):null;
async function sset(k,v){if(!sb)return false;const{error}=await sb.from('wc_store').upsert({k:k,v:v,updated_at:new Date().toISOString()},{onConflict:'k'});if(error){console.error(error);return false}return true}
async function sget(k){if(!sb)return null;const{data,error}=await sb.from('wc_store').select('v').eq('k',k).maybeSingle();if(error){console.error(error);return null}return data?data.v:null}
async function slist(prefix){if(!sb)return null;const{data,error}=await sb.from('wc_store').select('k').like('k',prefix+'%');if(error){console.error(error);return null}return(data||[]).map(x=>x.k)}
async function getAllPredictions(prefix){if(!sb)return[];const{data,error}=await sb.rpc('get_predictions',{prefix});if(error){console.error('getAllPredictions',error);return[]}return(data||[]).map(row=>row.v)}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

function normalizeName(r){return r.trim().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[إأآا]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').toLowerCase()}

function resolved(actual,m,side){

async function renderAdmin(){const actual=await getActual(),scores=await getScores();let html='<button class="btn btn-outline" id="adminLogoutKo" style="margin-bottom:10px;">🚪 خروج من وضع الأدمن</button><div class="banner">اعتماد نتائج الأدوار الإقصائية. الفائز ينتقل تلقائيًا للدور التالي.</div>';for(const m of KO){const a=resolved(actual,m,'a'),b=resolved(actual,m,'b');html+='<div class="match-card"><div class="match-meta"><span>'+m.label+'</span><span>'+m.venue+'</span></div>';if(!a||!b){html+='<div class="note">بانتظار اكتمال طرفي المباراة.</div>'}else{const sc=scores[m.id]||{};html+='<div class="score-grid"><div>'+TEAMS[a].flag+' '+TEAMS[a].name+'</div><input type="number" min="0" id="admin_'+m.id+'_a" value="'+(sc.a??'')+'" placeholder="0"><div>'+TEAMS[b].flag+' '+TEAMS[b].name+'</div><input type="number" min="0" id="admin_'+m.id+'_b" value="'+(sc.b??'')+'" placeholder="0"></div><div class="note" id="admin_'+m.id+'_pen_wrap" style="display:'+(sc.penalty?'block':'none')+';margin-top:8px;padding:10px;border:1.5px dashed var(--red);border-radius:12px;"><div style="margin-bottom:8px;font-weight:800;color:var(--red);">⚽ تعادل — من فاز بركلات الترجيح؟</div><div style="display:flex;gap:8px;"><button type="button" class="btn btn-outline admin-pen-pick'+(sc.penalty&&sc.winner===a?' btn-gold':'')+'" data-id="'+m.id+'" data-team="'+a+'" style="flex:1;">'+TEAMS[a].flag+' '+TEAMS[a].name+'</button><button type="button" class="btn btn-outline admin-pen-pick'+(sc.penalty&&sc.winner===b?' btn-gold':'')+'" data-id="'+m.id+'" data-team="'+b+'" style="flex:1;">'+TEAMS[b].flag+' '+TEAMS[b].name+'</button></div></div><button class="btn btn-gold admin-save" data-id="'+m.id+'" data-a="'+a+'" data-b="'+b+'">اعتماد النتيجة</button><div class="note">'+(actual[m.id]?'الفائز المعتمد: '+TEAMS[actual[m.id]].name+(sc.penalty?' (بركلات الترجيح)':''):'لم تعتمد النتيجة بعد.')+'</div>'}html+='</div>'}shell('🔒 مشرف الإقصائيات',html);
document.getElementById('adminLogoutKo').onclick=()=>{localStorage.removeItem('wc2026-admin-session');toast('تم الخروج من وضع الأدمن ✅');renderHome()};
document.querySelectorAll('#app .score-grid input[type=number]').forEach(inp=>{inp.oninput=()=>{const id=inp.id.replace('admin_','').split('_')[0];const av=document.getElementById('admin_'+id+'_a').value,bv=document.getElementById('admin_'+id+'_b').value;const wrap=document.getElementById('admin_'+id+'_pen_wrap');if(wrap){wrap.style.display=(av!==''&&bv!==''&&av===bv)?'block':'none';if(!(av!==''&&bv!==''&&av===bv))delete wrap.dataset.selectedTeam}}});
document.querySelectorAll('.admin-pen-pick').forEach(btn=>{btn.onclick=()=>{const id=btn.dataset.id;document.querySelectorAll('.admin-pen-pick[data-id="'+id+'"]').forEach(b=>b.classList.remove('btn-gold'));btn.classList.add('btn-gold');document.getElementById('admin_'+id+'_pen_wrap').dataset.selectedTeam=btn.dataset.team}});
document.querySelectorAll('.admin-save').forEach(btn=>btn.onclick=async()=>{const id=btn.dataset.id,a=btn.dataset.a,b=btn.dataset.b,va=document.getElementById('admin_'+id+'_a').value,vb=document.getElementById('admin_'+id+'_b').value;let w=winnerFromScore(a,b,va,vb),penalty=false;if(!w&&va!==''&&vb!==''&&va===vb){const wrap=document.getElementById('admin_'+id+'_pen_wrap');const penTeam=wrap?wrap.dataset.selectedTeam:null;if(!penTeam){toast('النتيجة تعادل — اختر الفائز بركلات الترجيح.');return}w=penTeam;penalty=true}if(!w){toast('اكتب نتيجة صحيحة.');return}const actual=await getActual(),scores=await getScores();actual[id]=w;scores[id]={a:va,b:vb,winner:w,penalty:penalty,savedAt:Date.now()};await sset('actual-results',actual);await sset('ko-actual-scores',scores);toast('✅ تم اعتماد النتيجة ونقل الفائز.');renderAdmin()})}
init();
</script></body></html>
