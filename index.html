<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>توقعاتي | كأس العالم 2026</title>
<meta name="theme-color" content="#050814">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="توقعات كأس العالم">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta property="og:title" content="🏆 توقعات المونديال 2026 - مين هيوصل للنهائي؟">
<meta property="og:description" content="توقع نتائج كل مباراة مع أصحابك وشوف مين الأصح توقعًا حتى النهائي">
<meta property="og:image" content="https://upload.wikimedia.org/wikipedia/commons/thumb/7/70/FIFA_World_Cup_Trophy.jpg/640px-FIFA_World_Cup_Trophy.jpg">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-dark:#eef4ff; --pitch:#f7eefc; --pitch-line:#dbe6f5;
    --gold:#ffcc33; --gold-deep:#a97a12; --chalk:#16233f; --chalk-dim:#64748b;
    --red:#dc2626; --green-ok:#16a34a; --card:#ffffff;
    --teal:#14b8c4; --blue:#2563eb; --purple:#7c3aed; --pink:#ec4899; --amber:#f59e0b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'Tajawal',sans-serif;
    background:
      radial-gradient(ellipse at 50% -5%, rgba(255,204,51,.35), transparent 42%),
      radial-gradient(ellipse at 15% 10%, rgba(20,184,196,.20), transparent 55%),
      radial-gradient(ellipse at 100% 15%, rgba(236,72,153,.16), transparent 55%),
      linear-gradient(135deg, #3d5ce0 0%, #5b8ef0 55%, #7fb0f5 100%);
    color:var(--chalk); min-height:100%; overflow-x:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background-image:var(--wc-logo-bg, none);
    background-repeat:no-repeat;
    background-position:center 36%;
    background-size:min(82vw,520px);
    opacity:.08;
    filter:none;
  }
  .num{font-family:'Oswald',sans-serif;}
  #app{max-width:480px;margin:0 auto;padding:18px 16px 60px;min-height:100vh;position:relative;z-index:1;}
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;letter-spacing:.5px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.15);}
  .brand .trophy{font-size:20px;}
  .navbtn{background:linear-gradient(135deg,var(--teal),var(--blue));border:none;color:#fff;font-family:'Tajawal';font-size:12px;padding:7px 14px;border-radius:20px;cursor:pointer;font-weight:800;box-shadow:0 3px 10px rgba(37,99,235,.25);}
  .navbtn:active{transform:scale(.96);}
  #hofBtn{background:linear-gradient(135deg,var(--purple),var(--pink));box-shadow:0 3px 10px rgba(124,58,237,.25);}
  #adminJump,#adminEntry{background:linear-gradient(135deg,var(--amber),var(--red));box-shadow:0 3px 10px rgba(245,158,11,.25);}
  a.navbtn{background:linear-gradient(135deg,var(--blue),var(--teal));text-decoration:none;display:inline-block;}
  .hero{text-align:center;padding:10px 6px 8px;}
  .hero h1{font-size:24px;margin:6px 0 4px;font-weight:900;line-height:1.35;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.15);}
  .hero h1 span{color:var(--gold);}
  .hero p{color:rgba(255,255,255,.92);font-size:13.5px;margin:0 0 16px;line-height:1.7;}
  .fieldwrap{background:var(--card);border:1px solid var(--pitch-line);border-radius:16px;padding:16px;margin-bottom:12px;text-align:right;box-shadow:0 6px 20px rgba(37,99,235,.10);}
  label{display:block;font-size:12px;color:var(--chalk-dim);margin-bottom:8px;}
  input[type=text], input[type=file]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--pitch-line);background:#f8fafc;color:var(--chalk);font-family:'Tajawal';font-size:15px;font-weight:700;}
  input[type=text]:focus{outline:2px solid var(--blue);}
  .btn{display:block;width:100%;text-align:center;padding:13px 16px;border-radius:12px;border:none;font-family:'Tajawal';font-weight:900;font-size:15px;cursor:pointer;margin-top:10px;}
  .btn-gold{background:linear-gradient(180deg,var(--gold),var(--gold-deep));color:#1a1200;}
  .btn-gold:active{transform:scale(.98);}
  .btn-outline{background:transparent;border:1px solid var(--pitch-line);color:var(--chalk);}
  .btn-ghost{background:transparent;color:var(--chalk-dim);font-weight:500;font-size:13px;text-decoration:underline;padding:8px;width:100%;text-align:center;}
  .round-header{display:flex;align-items:center;gap:8px;margin:20px 0 10px;}
  .round-header .line{flex:1;height:1px;background:var(--pitch-line);}
  .round-header .lbl{font-size:12px;font-weight:700;color:var(--gold-deep);white-space:nowrap;}
  .match-card{background:var(--card);border:1px solid var(--pitch-line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 4px 16px rgba(37,99,235,.10);}
  .match-meta{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--chalk-dim);margin-bottom:10px;gap:8px;}
  .status-pill{font-size:10.5px;padding:3px 9px;border-radius:20px;font-weight:700;white-space:nowrap;}
  .vote-summary{margin-top:10px;padding-top:10px;border-top:1px dashed var(--pitch-line);}
  .vote-row{display:flex;justify-content:space-between;font-size:11.5px;color:var(--chalk-dim);margin-bottom:5px;gap:6px;}
  .vote-row b{color:var(--chalk);}
  .vote-track{display:flex;height:12px;border-radius:7px;overflow:hidden;background:#eef2f7;border:1px solid var(--pitch-line);}
  .vote-fill-a{background:linear-gradient(90deg,var(--gold-deep),var(--gold));transition:width .4s;}
  .vote-fill-b{background:linear-gradient(90deg,var(--blue),var(--teal));transition:width .4s;}
  .vote-total{font-size:10px;color:var(--chalk-dim);text-align:center;margin-top:5px;opacity:.8;}
  .hof-hero{text-align:center;padding:22px 14px;margin-bottom:14px;border-radius:16px;background:linear-gradient(135deg, var(--teal), var(--purple));border:none;color:#fff;}
  .hof-hero-title{font-family:Oswald;font-size:22px;font-weight:900;color:#fff;}
  .hof-hero-sub{font-size:12px;color:rgba(255,255,255,.88);margin-top:6px;}
  .hof-section{margin-bottom:14px;}
  .hof-section-title{font-weight:900;color:var(--gold-deep);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;font-size:14px;}
  .hof-count{font-size:10.5px;color:var(--chalk-dim);font-weight:600;}
  .hof-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;}
  .hof-badge{background:var(--card);border:1.5px solid var(--gold-deep);border-radius:14px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px;box-shadow:0 4px 14px rgba(37,99,235,.10);}
  .hof-medal{font-size:22px;}
  .hof-badge-name{font-weight:800;font-size:12.5px;color:var(--chalk);}
  .hof-badge-sub{font-size:10px;color:var(--gold-deep);}
  .hof-cta{display:block;text-decoration:none;text-align:center;background:linear-gradient(135deg,var(--purple),var(--pink));border:none;border-radius:14px;padding:12px 14px;color:#fff;font-weight:900;font-size:13px;}
  .ticker-wrap{overflow:hidden;white-space:nowrap;border:1.5px solid var(--teal);border-radius:12px;background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,.92));padding:9px 0;margin-bottom:14px;box-shadow:0 6px 18px rgba(20,20,60,.12);}
  .ticker-track{display:inline-block;white-space:nowrap;animation:ticker-scroll 32s linear infinite;}
  .ticker-wrap:hover .ticker-track{animation-play-state:paused;}
  .ticker-item{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:var(--chalk);margin-inline-end:34px;}
  .ticker-item b{color:var(--blue);font-family:Oswald;}
  @keyframes ticker-scroll{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
  .notice-ticker-wrap{overflow:hidden;white-space:nowrap;border:1.5px solid var(--red);border-radius:12px;background:rgba(255,255,255,.94);padding:9px 0;margin-bottom:14px;box-shadow:0 6px 18px rgba(20,20,60,.12);}
  .notice-ticker-track{display:inline-block;white-space:nowrap;animation:ticker-scroll 30s linear infinite;}
  .notice-ticker-wrap:hover .notice-ticker-track{animation-play-state:paused;}
  .notice-ticker-item{font-size:12.5px;font-weight:800;color:var(--chalk);}
  .notice-ticker-item b{color:var(--red);}
  .status-open{background:rgba(22,163,74,.12);color:#15803d;border:1px solid rgba(22,163,74,.4);}
  .status-locked{background:rgba(220,38,38,.10);color:#b91c1c;border:1px solid rgba(220,38,38,.35);}
  .status-pending{background:rgba(100,116,139,.10);color:var(--chalk-dim);border:1px solid var(--pitch-line);}
  .status-finished{background:rgba(255,204,51,.18);color:var(--gold-deep);border:1px solid var(--gold-deep);}
  .team-row{display:flex;align-items:center;gap:10px;width:100%;background:#f8fafc;border:2px solid var(--pitch-line);border-radius:12px;padding:11px 12px;margin:6px 0;cursor:pointer;transition:.15s;text-align:right;color:var(--chalk);font-family:'Tajawal';}
  .team-row .flag{font-size:22px;}
  .team-row .name{font-weight:700;font-size:14.5px;flex:1;}
  .team-row.selected{border-color:var(--gold-deep);background:linear-gradient(90deg, rgba(255,204,51,.22), rgba(255,204,51,.05));}
  .team-row.correct{border-color:var(--green-ok);background:rgba(22,163,74,.08);}
  .team-row.wrong{border-color:var(--red);opacity:.6;}
  .team-row.disabled{cursor:default;}
  .team-row.static{cursor:default;background:#f1f5f9;}
  .vs-label{text-align:center;color:var(--chalk-dim);font-size:10.5px;font-weight:700;letter-spacing:2px;margin:2px 0;}
  .note{font-size:11.5px;color:var(--chalk-dim);text-align:center;margin-top:6px;line-height:1.7;}
  .lb-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--pitch-line);border-radius:14px;padding:12px 14px;margin-bottom:8px;box-shadow:0 4px 14px rgba(37,99,235,.10);}
  .lb-rank{font-family:'Oswald';font-weight:700;font-size:16px;color:var(--gold-deep);width:22px;text-align:center;}
  .lb-name{font-weight:700;font-size:14.5px;flex:1;}
  .lb-champ{font-size:20px;}
  .lb-score{font-family:'Oswald';font-weight:700;font-size:15px;color:var(--chalk);}
  .lb-score small{color:var(--chalk-dim);font-size:10px;font-weight:400;}
  .empty-note{color:var(--chalk-dim);font-size:13px;text-align:center;padding:30px 10px;line-height:1.8;}
  .banner{font-size:12px;text-align:center;color:var(--chalk-dim);background:var(--card);border:1px solid var(--pitch-line);border-radius:10px;padding:8px;margin-bottom:14px;line-height:1.8;}
  .error-banner{color:#b91c1c;border-color:#fca5a5;background:rgba(220,38,38,.06);}
  #fx-canvas{position:fixed;inset:0;pointer-events:none;z-index:999;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--gold);color:#1a1200;font-weight:700;font-size:13px;padding:10px 18px;border-radius:30px;z-index:1000;opacity:0;transition:.3s;max-width:90%;text-align:center;}
  .toast.show{opacity:1;bottom:30px;}
  .pin-overlay{position:fixed;inset:0;background:rgba(10,20,40,.55);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;}
  .pin-box{background:var(--card);border:1px solid var(--pitch-line);border-radius:16px;padding:20px;width:100%;max-width:320px;box-shadow:0 12px 34px rgba(20,40,80,.18);}

  .promo-card{
    background:linear-gradient(135deg, rgba(255,255,255,.97), rgba(255,255,255,.94));
    border:2px solid rgba(124,58,237,.35);
    border-radius:18px;
    padding:14px;
    margin:12px 0 14px;
    box-shadow:0 10px 26px rgba(20,20,60,.18);
  }
  .promo-title{text-align:center;color:var(--purple);font-weight:900;font-size:18px;margin:0 0 10px;}
  .promo-grid{display:grid;grid-template-columns:1fr;gap:8px;}
  .mini-box{background:#f8fafc;border:1px solid var(--pitch-line);border-radius:14px;padding:10px;line-height:1.8;font-size:12.5px;color:var(--chalk);}
  .mini-box b{color:var(--gold-deep);}
  .prize-row{display:flex;gap:8px;justify-content:space-between;text-align:center;margin-top:6px;}
  .prize{flex:1;background:#fff;border:1px solid var(--gold-deep);border-radius:12px;padding:8px 4px;font-weight:900;color:var(--blue);}
  .prize span{display:block;font-size:22px;margin-bottom:2px;}
  .ticker{
    border:1px solid var(--gold-deep);
    background:rgba(255,204,51,.14);
    color:var(--gold-deep);
    border-radius:999px;
    padding:8px 12px;
    font-weight:900;
    font-size:12px;
    text-align:center;
    margin:8px 0 12px;
  }
  .lb-stats{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;margin-top:5px;}
  .stat-pill{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    padding:6px 12px;
    border-radius:999px;
    background:linear-gradient(135deg,#0b3d91,#0a2f6b);
    color:#ffffff;
    border:1px solid rgba(255,215,106,.65);
    font-weight:800;
    font-size:11px;
    box-shadow:0 3px 10px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.12);
    text-shadow:none;
}
.stat-pill.good{
    background:linear-gradient(135deg,#0b5cc4,#1274ff);
    color:#fff;
}
.stat-pill.bad{
    background:linear-gradient(135deg,#123f8f,#0d2d66);
    color:#fff;
}
  .hero-logo{
    width:min(230px,68vw);
    display:block;
    margin:0 auto 12px;
    border-radius:14px;
    box-shadow:0 12px 30px rgba(20,40,80,.18);
  }


  .compact-vote-summary{
    padding:8px 10px!important;
    margin-top:8px!important;
    font-size:11px!important;
    line-height:1.6!important;
    opacity:.92;
  }
  .danger-zone{
    border-color:#fca5a5!important;
    background:rgba(220,38,38,.05)!important;
    margin-top:18px!important;
  }


/* =========================================================
   WORLD CUP PREMIUM MOBILE IDENTITY - VISUAL ONLY PATCH
   لا يغيّر أي منطق برمجي، فقط يرفع الهوية البصرية والوضوح
   ========================================================= */
:root{
  --pitch-dark:#050814 !important;
  --pitch:#07172f !important;
  --pitch-line:rgba(255,214,112,.34) !important;
  --gold:#ffd76a !important;
  --gold-deep:#b88718 !important;
  --chalk:#ffffff !important;
  --chalk-dim:#d7e3ff !important;
  --card:rgba(8,18,42,.78) !important;
  --blue:#0b4fd7 !important;
  --teal:#16d8d8 !important;
  --purple:#7338f4 !important;
  --pink:#ff3fa4 !important;
  --amber:#f6b826 !important;
  --red:#ff4b5f !important;
  --green-ok:#22c55e !important;
}
html{background:#050814 !important;}
body{
  color:#fff !important;
  background:
    radial-gradient(circle at 50% -10%, rgba(255,215,106,.28) 0, transparent 33%),
    radial-gradient(circle at 88% 8%, rgba(22,216,216,.18) 0, transparent 28%),
    radial-gradient(circle at 10% 22%, rgba(255,63,164,.14) 0, transparent 30%),
    linear-gradient(160deg,#050814 0%,#071a3f 35%,#0a367b 72%,#05142c 100%) !important;
  background-attachment:fixed !important;
  min-height:100vh !important;
}
body::before{
  content:"🏆" !important;
  position:fixed !important;
  inset:auto auto 4vh 50% !important;
  transform:translateX(-50%) rotate(-5deg) !important;
  width:auto !important;height:auto !important;
  font-size:min(88vw,440px) !important;
  line-height:1 !important;
  opacity:.075 !important;
  filter:drop-shadow(0 0 36px rgba(255,215,106,.55)) saturate(1.25) !important;
  z-index:0 !important;
  pointer-events:none !important;
  background:none !important;
}
body::after{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(90deg, transparent 0 49%, rgba(255,215,106,.06) 50%, transparent 51%),
    radial-gradient(circle at 18% 74%, rgba(255,215,106,.12), transparent 24%),
    radial-gradient(circle at 82% 70%, rgba(22,216,216,.10), transparent 25%);
  opacity:.9;
}
#app{
  max-width:520px !important;
  padding:16px 13px 76px !important;
  position:relative !important;
  z-index:1 !important;
}
.topbar{
  position:sticky;top:8px;z-index:20;
  padding:9px !important;
  border:1px solid rgba(255,215,106,.34) !important;
  border-radius:22px !important;
  background:linear-gradient(135deg,rgba(6,13,31,.86),rgba(8,31,78,.76)) !important;
  box-shadow:0 12px 34px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.10) !important;
  backdrop-filter:blur(18px) !important;
}
.brand{
  color:#fff !important;
  font-size:14px !important;
  font-weight:900 !important;
  text-shadow:0 2px 14px rgba(255,215,106,.42) !important;
  letter-spacing:.2px !important;
}
.brand::before{content:"🏆";margin-inline-end:3px;filter:drop-shadow(0 0 8px rgba(255,215,106,.8));}
.brand .trophy{display:none !important;}
.navbtn,.btn,.hof-cta{
  border:none !important;
  border-radius:999px !important;
  color:#07101f !important;
  background:linear-gradient(180deg,#fff1a6 0%,#ffd76a 45%,#b88718 100%) !important;
  box-shadow:0 8px 22px rgba(184,135,24,.34), inset 0 1px 0 rgba(255,255,255,.65) !important;
  font-weight:900 !important;
  text-shadow:none !important;
}
.navbtn{padding:9px 14px !important;font-size:12.5px !important;}
a.navbtn,#hofBtn,#adminJump,#adminEntry,#lbBtn{
  background:linear-gradient(135deg,#19f0df 0%,#0b63ff 48%,#ffd76a 100%) !important;
  color:#fff !important;
  text-shadow:0 1px 8px rgba(0,0,0,.35) !important;
}
.hero,.hof-hero,.promo-card{
  position:relative !important;
  overflow:hidden !important;
  border:1px solid rgba(255,215,106,.40) !important;
  border-radius:26px !important;
  background:
    linear-gradient(135deg,rgba(8,18,42,.88),rgba(11,54,123,.76)),
    radial-gradient(circle at 80% 12%, rgba(255,215,106,.22), transparent 34%) !important;
  box-shadow:0 18px 46px rgba(0,0,0,.32), inset 0 1px 0 rgba(255,255,255,.12) !important;
  backdrop-filter:blur(16px) !important;
}
.hero::after,.hof-hero::after,.promo-card::after,.match-card::after,.fieldwrap::after{
  content:"🏆";position:absolute;left:12px;bottom:-28px;font-size:96px;line-height:1;opacity:.06;filter:drop-shadow(0 0 18px rgba(255,215,106,.55));pointer-events:none;
}
.hero h1{font-size:25px !important;color:#fff !important;line-height:1.25 !important;text-shadow:0 4px 18px rgba(0,0,0,.36) !important;}
.hero h1 span,.hero p b{color:#ffd76a !important;}
.hero p{color:#eaf2ff !important;font-size:13px !important;}
.fieldwrap,.match-card,.lb-row,.hof-badge,.banner,.ticker-wrap,.notice-ticker-wrap,.mini-box,.pin-box{
  position:relative !important;
  overflow:hidden !important;
  color:#fff !important;
  background:linear-gradient(145deg,rgba(7,18,44,.86),rgba(12,35,82,.74)) !important;
  border:1px solid rgba(255,215,106,.34) !important;
  box-shadow:0 14px 34px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.10) !important;
  backdrop-filter:blur(16px) !important;
}
.fieldwrap,.match-card{border-radius:24px !important;padding:15px !important;margin-bottom:13px !important;}
.banner{border-radius:18px !important;color:#eaf2ff !important;background:linear-gradient(135deg,rgba(255,215,106,.12),rgba(22,216,216,.10),rgba(8,18,42,.76)) !important;}
.round-header{margin:22px 0 12px !important;}
.round-header .lbl{
  color:#07101f !important;
  background:linear-gradient(180deg,#fff1a6,#ffd76a 55%,#b88718) !important;
  border-radius:999px !important;
  padding:7px 14px !important;
  font-size:13px !important;
  box-shadow:0 8px 20px rgba(184,135,24,.35) !important;
}
.round-header .line{height:2px !important;background:linear-gradient(90deg,transparent,rgba(255,215,106,.70),transparent) !important;}
.match-meta{color:#dbe7ff !important;font-size:12px !important;font-weight:800 !important;}
.match-meta span:first-child{color:#fff !important;}
.pill,.status-pill{
  background:rgba(255,215,106,.12) !important;
  border:1px solid rgba(255,215,106,.42) !important;
  color:#ffe9a1 !important;
  font-weight:900 !important;

/* ---------------- Supabase Storage Adapter ---------------- */
const SUPABASE_READY = !!(window.WC_SUPABASE_CONFIG && window.WC_SUPABASE_CONFIG.url && window.WC_SUPABASE_CONFIG.anonKey && !window.WC_SUPABASE_CONFIG.url.includes('PUT_'));
const sb = SUPABASE_READY ? window.supabase.createClient(window.WC_SUPABASE_CONFIG.url, window.WC_SUPABASE_CONFIG.anonKey) : null;

async function sset(key, value, shared=false){
  if(!sb) return false;
  const { error } = await sb.from('wc_store').upsert({ k:key, v:value, updated_at:new Date().toISOString() }, { onConflict:'k' });
  if(error){ console.error('sset', error); return false; }
  return true;
}
async function sget(key, shared=false){
  if(!sb) return null;
  const { data, error } = await sb.from('wc_store').select('v').eq('k', key).maybeSingle();
  if(error){ console.error('sget', error); return null; }
  return data ? data.v : null;
}
async function slist(prefix, shared=false){
  if(!sb) return null;
  const { data, error } = await sb.from('wc_store').select('k').like('k', prefix + '%');
  if(error){ console.error('slist', error); return null; }
  return (data || []).map(x => x.k);
}
// يجلب كل سجلات التنبؤ ببادئة معيّنة بطلب واحد فقط (بدل حلقة sget لكل مستخدم)
async function getAllPredictions(prefix){
  if(!sb) return null;
  const { data, error } = await sb.rpc('get_predictions', { prefix });
  if(error){ console.error('getAllPredictions', error); return null; }
  return (data || []).map(row => row.v);
}
async function sdel(key, shared=false){
  if(!sb) return false;
  const { error } = await sb.from('wc_store').delete().eq('k', key);
  if(error){ console.error('sdel', error); return false; }
  return true;
}

/* ---------------- Data ---------------- */
const TEAMS = {
  PAR:{name:'باراغواي', flag:'🇵🇾'}, FRA:{name:'فرنسا', flag:'🇫🇷'},
  CAN:{name:'كندا', flag:'🇨🇦'},    MAR:{name:'المغرب', flag:'🇲🇦'},
  POR:{name:'البرتغال', flag:'🇵🇹'}, ESP:{name:'إسبانيا', flag:'🇪🇸'},
  USA:{name:'أمريكا', flag:'🇺🇸'},   BEL:{name:'بلجيكا', flag:'🇧🇪'},
  BRA:{name:'البرازيل', flag:'🇧🇷'}, NOR:{name:'النرويج', flag:'🇳🇴'},
  MEX:{name:'المكسيك', flag:'🇲🇽'}, ENG:{name:'إنجلترا', flag:'🏴'},
  ARG:{name:'الأرجنتين', flag:'🇦🇷'}, EGY:{name:'مصر', flag:'🇪🇬'},
  SUI:{name:'سويسرا', flag:'🇨🇭'},  COL:{name:'كولومبيا', flag:'🇨🇴'}

const MATCHES = [

  {id:'m2',  round:0, a:'CAN', b:'MAR', kickoff:'2026-07-04T17:00:00Z', venue:'هيوستن'},

/* ملاحظة: ربع النهائي/نصف النهائي/النهائي أصبح التصويت عليها حصريًا في knockout.html
   (تصويت بالنتيجة بالأهداف)، فلم تعد ضمن هذا الجدول لتفادي ازدواج التصويت. */
const ROUND_LABELS = ['دور الـ16','ربع النهائي','نصف النهائي','النهائي'];

const LOCK_MINUTES_BEFORE = 5;
const ADMIN_PIN = (window.WC_SUPABASE_CONFIG && window.WC_SUPABASE_CONFIG.adminPin) || 'QX742';

function matchById(id){ return MATCHES.find(m=>m.id===id); }
function normalizeName(raw){
  return raw.trim().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[إأآا]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي').replace(/\s+/g,' ').toLowerCase();
}
let state = { view:'loading', name:'', isAdmin:false };

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]));
}
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

        </div>
      </div>`;
    document.body.appendChild(overlay);

    setTimeout(()=>input.focus(), 50);
    function cleanup(result){ document.body.removeChild(overlay); resolve(result); }
    overlay.querySelector('#pinCancel').onclick = ()=>cleanup(false);
    overlay.querySelector('#pinOk').onclick = ()=>cleanup(input.value === ADMIN_PIN);
    input.addEventListener('keydown', e=>{ if(e.key === 'Enter') cleanup(input.value === ADMIN_PIN); });

}

/* ---------------- Data access ---------------- */
async function getActual(){ return (await sget('actual-results', true)) || {}; }
async function getMyPicks(){
  const p = await sget(`predictions:${state.nameKey}`, true);
  return p ? (p.picks || {}) : {};
}
function resolvedTeam(actual, match, side){
  if(match.round === 0) return side === 'a' ? match.a : match.b;
  const feedId = side === 'a' ? match.feedA : match.feedB;
  return actual[feedId] || null;
}
function matchStatus(actual, match, myPicks){
  const teamA = resolvedTeam(actual, match, 'a');
  const teamB = resolvedTeam(actual, match, 'b');
  const result = actual[match.id] || null;
  const lockTime = new Date(match.kickoff).getTime() - LOCK_MINUTES_BEFORE*60000;
  const now = Date.now();
  let phase;
  if(!teamA || !teamB) phase = 'pending';
  else if(result) phase = 'finished';
  else if(now >= lockTime) phase = 'locked';
  else phase = 'open';
  return { teamA, teamB, result, phase, myPick: myPicks[match.id] || null };
}
function localTimeStr(iso){
  const d = new Date(iso);
  return d.toLocaleString('ar', {weekday:'short', day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
}

/* ---------------- Init ---------------- */
async function init(){
  if(!SUPABASE_READY){
    state.view='config-error';
    renderConfigError();
    return;
  }
  await applySavedLogo();
  const savedKey = localStorage.getItem('wc2026-player-key');
  if(savedKey){
    const ident = await sget(`identity:${savedKey}`, true);
    if(ident && ident.name){ state.name = ident.name; state.nameKey = savedKey; state.view='matches'; }
    else state.view='name';
  } else state.view='name';
  render();
  setInterval(()=>{ if(state.view === 'matches') render(); }, 30000);
}
function render(){
  if(state.view === 'name') return renderName();
  if(state.view === 'codeReveal') return renderCodeReveal();
  if(state.view === 'matches') return renderMatches();
  if(state.view === 'leaderboard') return renderLeaderboard();
  if(state.view === 'hof') return renderHallOfFame();
  if(state.view === 'finalChampions') return renderFinalChampions();
  if(state.view === 'admin') return renderAdmin();
}

}

/* ---------------- Name gate ---------------- */
function renderName(){
  $app.innerHTML = `
    <div class="topbar"><div class="brand"><span class="trophy">🏆</span> توقعات المونديال 2026</div></div>
    <div class="hero">
      <img class="hero-logo" src="" id="heroLogo" style="display:none;">
      <h1>مين هيوصل <span>للنهائي؟</span></h1>
      <p>شارك بتوقعاتك، تابع ترتيبك بعد كل مباراة، ونافس على جوائز المراكز الثلاثة الأولى 🔥</p>
      ${publicInfoCard()}
      <div class="fieldwrap">
        <label>اكتب اسمك للمشاركة</label>
        <input type="text" id="nameInput" placeholder="مثال: أحمد">
        <label style="margin-top:10px;">الرمز (فقط إن كنت مسجلاً من قبل)</label>
        <input type="text" id="codeInput" placeholder="مثال: 482" maxlength="3" inputmode="numeric">
        <div class="note" style="margin-top:8px;">⚠️ إذا ظهرت رسالة "هذا الاسم مسجّل" ولا تملك رمزًا: تواصل مع المشرف مباشرة ليعطيك رمزك الخاص.</div>
        <button class="btn btn-gold" id="startBtn" style="margin-top:10px;">🔮 ابدأ المشاركة</button>
      </div>
      <div class="note" style="margin-top:16px;">إعداد: أبو الهيثم</div>
    </div>
  `;
  applySavedLogo();
  document.getElementById('startBtn').onclick = async ()=>{
    const v = document.getElementById('nameInput').value.trim();
    const codeEntered = document.getElementById('codeInput').value.trim();
    if(!v){ toast('اكتب اسمك الأول 🙂'); return; }
    const key = normalizeName(v);
    if(!key){ toast('اكتب اسمًا صحيحًا'); return; }
    const existingIdentity = await sget(`identity:${key}`, true);
    if(existingIdentity){
      if(!existingIdentity.code){
        localStorage.setItem('wc2026-player-key', key);
        state.name = existingIdentity.name; state.nameKey = key; state.view = 'matches'; render();
        return;
      }
      if(!codeEntered){ toast('هذا الاسم مسجّل — اكتب رمزك المكوّن من 3 أرقام للدخول'); return; }
      if(codeEntered !== existingIdentity.code){ toast('الرمز غير صحيح ❌'); return; }
      localStorage.setItem('wc2026-player-key', key);
      state.name = existingIdentity.name; state.nameKey = key; state.view = 'matches'; render();
      return;
    }
    const newCode = String(Math.floor(100 + Math.random()*900));
    const ok1 = await sset(`identity:${key}`, { name: v, code: newCode, registeredAt: Date.now() }, true);
    if(!ok1){ toast('تعذّر حفظ الاسم. تأكد من Supabase.'); return; }
    localStorage.setItem('wc2026-player-key', key);
    state.name = v; state.nameKey = key; state.pendingCode = newCode; state.view = 'codeReveal'; render();
  };
}

async function renderMatches(){
  const scrollY = window.scrollY;
  $app.innerHTML = `<div class="banner">جاري تحميل المباريات...</div>`;
  const actual = await getActual();
  const myPicks = await getMyPicks();
  const allPreds = (await getAllPredictions('predictions:')) || [];
  function voteCounts(matchId, teamA, teamB){
    let a = 0, b = 0;
    allPreds.forEach(p=>{
      const pick = p.picks ? p.picks[matchId] : null;
      if(pick === teamA) a++;
      else if(pick === teamB) b++;
    });
    return { a, b, total: a + b };
  }
  function voteBarHtml(matchId, teamA, teamB){
    const tA = TEAMS[teamA], tB = TEAMS[teamB];
    const { a, b, total } = voteCounts(matchId, teamA, teamB);
    const pctA = total ? Math.round((a/total)*100) : 50;
    const pctB = total ? 100 - pctA : 50;
    return `
      <div class="vote-summary">
        <div class="vote-row"><span>${tA.flag} ${tA.name} <b>${pctA}%</b></span><span><b>${pctB}%</b> ${tB.name} ${tB.flag}</span></div>
        <div class="vote-track"><div class="vote-fill-a" style="width:${pctA}%"></div><div class="vote-fill-b" style="width:${pctB}%"></div></div>
        <div class="vote-total">${total ? `👥 ${total} صوّتوا حتى الآن` : 'لا توجد أصوات بعد'}</div>
      </div>`;
  }
  function topPlayersTickerHtml(){
    const scored = allPreds.map(p=>{
      let pts=0, correct=0, voted=0;
      MATCHES.forEach(m=>{
        const result=actual[m.id], pick=p.picks?p.picks[m.id]:null;
        if(result && pick){ voted++; if(result===pick){correct++; pts+=ROUND_WEIGHTS[m.round]||0;} }
      });
      return { name:p.name, pts, correct, voted };
    }).filter(p=>p.voted>0).sort((a,b)=>(b.pts-a.pts)||(b.correct-a.correct));
    if(!scored.length) return '';
    const medals=['🥇','🥈','🥉','🏅','🏅'];
    const items = scored.slice(0,5).map((p,i)=>
      `<span class="ticker-item">${medals[i]||'🏅'} ${escapeHtml(p.name)} <b>${p.pts} نقطة</b></span>`
    ).join('');
    return `<div class="ticker-wrap"><div class="ticker-track">${items}${items}</div></div>`;
  }
  function accessNoticeTickerHtml(){
    return `<div class="notice-ticker-wrap"><div class="notice-ticker-track"><span class="notice-ticker-item">⚠️ <b>تنبيه:</b> إذا واجهت مشكلة في الدخول باسمك (طُلب منك رمز ولا تملكه) — تواصل مع المشرف مباشرة ليعطيك رمزك الخاص. بياناتك وتوقعاتك محفوظة ولن تتأثر.</span></div></div>`;
  }
  let html = `
    <div class="topbar">
      <div class="brand"><span class="trophy">🏆</span> أهلاً ${escapeHtml(state.name)}</div>
      <button class="navbtn" id="lbBtn">📊 لوحة الترتيب</button><button class="navbtn" id="hofBtn">🏅 الأبطال</button><button class="navbtn" id="finalChampBtn">🏆 الأبطال النهائيون</button>${state.isAdmin ? `<button class="navbtn" id="adminJump">🔒 لوحة الأدمن</button>` : ''}<a class="navbtn" href="./knockout.html">🏆 الأدوار الإقصائية</a>
    </div>
    ${topPlayersTickerHtml()}
    ${accessNoticeTickerHtml()}
    <a href="./knockout.html" style="display:block;text-decoration:none;background:linear-gradient(135deg,#7c3aed,#ec4899);border:none;border-radius:14px;padding:12px 14px;margin-bottom:14px;text-align:center;color:#fff;font-weight:900;font-size:14px;">
      🏆 صوّت الآن على أدوار ربع/نصف النهائي والنهائي ‹ اضغط هنا
    </a>
    ${publicInfoCard()}
  `;
  let lastRound = -1;
  MATCHES.forEach(match=>{
    if(match.round !== lastRound){
      html += `<div class="round-header"><span class="lbl">${ROUND_LABELS[match.round]}</span><div class="line"></div></div>`;
      lastRound = match.round;
    }
    const st = matchStatus(actual, match, myPicks);
    const teamA = st.teamA ? TEAMS[st.teamA] : null;
    const teamB = st.teamB ? TEAMS[st.teamB] : null;
    let pillClass, pillText;
    if(st.phase==='pending'){ pillClass='status-pending'; pillText='بانتظار تحديد الفرق'; }
    else if(st.phase==='finished'){ pillClass='status-finished'; pillText='انتهت'; }
    else if(st.phase==='locked'){ pillClass='status-locked'; pillText='التصويت مغلق'; }
    else { pillClass='status-open'; pillText='التصويت مفتوح'; }

    html += `<div class="match-card" data-id="${match.id}">
      <div class="match-meta">
        <span>${match.venue} · ${localTimeStr(match.kickoff)} (بتوقيتك)</span>
        <span class="status-pill ${pillClass}">${pillText}</span>
      </div>`;
    if(st.phase === 'pending'){
      const slotHtml = (code, feedId) => code
        ? `<div class="team-row static"><span class="flag">${TEAMS[code].flag}</span><span class="name">${TEAMS[code].name}</span><span>✅ متأهل</span></div>`
        : `<div class="team-row static" style="opacity:.5"><span class="flag">❔</span><span class="name">بانتظار الفريق المتأهل</span></div>`;
      html += `${slotHtml(st.teamA, match.feedA)}
                <div class="vs-label">VS</div>
                ${slotHtml(st.teamB, match.feedB)}`;
      if(st.teamA || st.teamB){
        html += `<div class="note">✅ تأهل <b>${TEAMS[st.teamA||st.teamB].name}</b> لهذه المباراة تلقائيًا — بانتظار الفريق الثاني.</div>`;
      } else {
        html += `<div class="note">بانتظار نتائج الدور السابق</div>`;
      }
    } else if(st.phase === 'finished'){
      [['a',teamA,st.teamA],['b',teamB,st.teamB]].forEach(([side,t,code])=>{
        const isResult = st.result === code;
        const isMyPick = st.myPick === code;
        let cls = 'team-row static';
        if(isResult) cls += ' correct'; else if(isMyPick) cls += ' wrong';
        html += `<div class="${cls}"><span class="flag">${t.flag}</span><span class="name">${t.name}</span>${isResult?'<span>🏆</span>':''}${isMyPick&&!isResult?'<span>توقعك</span>':''}</div>`;
      });
      html += `<div class="note">${st.myPick ? (st.result===st.myPick ? `✅ توقعت صح! +${ROUND_WEIGHTS[match.round]} نقطة` : '❌ توقعت غلط') : 'لم تصوّت في هذه المباراة'}</div>`;
    } else if(st.phase === 'locked'){
      [['a',teamA,st.teamA],['b',teamB,st.teamB]].forEach(([side,t,code])=>{
        const isMyPick = st.myPick === code;
        html += `<div class="team-row static ${isMyPick?'selected':''}"><span class="flag">${t.flag}</span><span class="name">${t.name}</span></div>`;
      });
      html += `<div class="note">${st.myPick ? '✅ صوّتّك محفوظ، بانتظار النتيجة' : '⏱️ فاتك وقت التصويت'}</div>`;
    } else {
      if(st.myPick){
        [['a',teamA,st.teamA],['b',teamB,st.teamB]].forEach(([side,t,code])=>{
          const isMyPick = st.myPick === code;
          html += `<div class="team-row static ${isMyPick?'selected':''}"><span class="flag">${t.flag}</span><span class="name">${t.name}</span></div>`;
        });
        html += `<div class="note">✅ تم حفظ توقعك تلقائيًا — لا يوجد زر إرسال ولا يمكن التعديل بعد الحفظ</div>`;
      } else {
        html += `<button class="team-row vote-btn" data-match="${match.id}" data-pick="${st.teamA}"><span class="flag">${teamA.flag}</span><span class="name">${teamA.name}</span></button>
                  <div class="vs-label">VS</div>
                  <button class="team-row vote-btn" data-match="${match.id}" data-pick="${st.teamB}"><span class="flag">${teamB.flag}</span><span class="name">${teamB.name}</span></button>
                  <div class="note">يغلق التصويت الساعة ${localTimeStr(new Date(new Date(match.kickoff).getTime()-LOCK_MINUTES_BEFORE*60000).toISOString())}</div>`;
      }
    }
    if(st.phase !== 'pending'){
      html += voteBarHtml(match.id, st.teamA, st.teamB);
    }
    html += `</div>`;
  });
  html += `<button class="btn-ghost" id="adminEntry">🔒 دخول المشرف</button>
    <div class="note" style="margin-top:10px;">إعداد: أبو الهيثم</div>`;
  $app.innerHTML = html;
  window.scrollTo(0, scrollY);
  document.getElementById('lbBtn').onclick = ()=>{ state.view='leaderboard'; render(); };
  document.getElementById('hofBtn').onclick = ()=>{ state.view='hof'; render(); };
  document.getElementById('finalChampBtn').onclick = ()=>{ state.view='finalChampions'; render(); };
  if(document.getElementById('adminJump')){
    document.getElementById('adminJump').onclick = ()=>{ state.view='admin'; render(); };
  }
  document.getElementById('adminEntry').onclick = async ()=>{
    if(!(await askPinAsync())){ toast('رمز غير صحيح ❌'); return; }
    state.isAdmin = true;
    state.view = 'admin'; render();
  };
  $app.querySelectorAll('.vote-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const matchId = btn.getAttribute('data-match');
      const pick = btn.getAttribute('data-pick');
      const current = await sget(`predictions:${state.nameKey}`, true);
      const picks = current ? (current.picks||{}) : {};
      if(picks[matchId]){ toast('لقد صوّتّ في هذه المباراة بالفعل'); render(); return; }
      const freshActual = await getActual();
      const m = matchById(matchId);
      const st2 = matchStatus(freshActual, m, picks);
      if(st2.phase !== 'open'){ toast('انتهى وقت التصويت لهذه المباراة'); render(); return; }
      picks[matchId] = pick;
      const ok = await sset(`predictions:${state.nameKey}`, { name: state.name, key: state.nameKey, picks, updatedAt: Date.now() }, true);
      if(!ok){ toast('فشل حفظ التصويت، حاول مرة أخرى'); return; }
      toast('تم تسجيل توقعك ✅');
      if(matchId === 'final') burstCelebration(1);
      render();
    };
  });
}

/* ---------------- Leaderboard ---------------- */
async function renderLeaderboard(){
  $app.innerHTML = `<div class="topbar"><button class="navbtn" id="backBtn">‹ المباريات</button><div class="brand" style="font-size:13px">📊 لوحة الترتيب</div></div><div class="banner">جاري التحميل...</div>`;

  const actual = await getActual();
  if(people === null){
    $app.querySelector('.banner').outerHTML = `<div class="empty-note error-banner">تعذّر تحميل التوقعات من قاعدة البيانات.</div>`;
    return;
  }
  if(people.length===0){
    $app.querySelector('.banner').outerHTML = `<div class="empty-note">لسه محدش صوّت 🤷‍♂️<br>ارجع للمباريات وابدأ توقعك!</div>`;
    return;
  }

  const decidedMatches = MATCHES.filter(m => actual[m.id]).length;

  const scored = people.map(p=>{
    let score = 0, correct = 0, wrong = 0, voted = 0;
    MATCHES.forEach(m=>{
      const result = actual[m.id];
      const pick = p.picks ? p.picks[m.id] : null;
      if(result && pick){
        voted++;
        if(result === pick){
          correct++;
          score += ROUND_WEIGHTS[m.round];
        } else {
          wrong++;
        }
      }
    });
    const accuracy = (correct + wrong) ? Math.round((correct / (correct + wrong)) * 100) : 0;
    const champPick = p.picks ? p.picks['final'] : null;
    return { name:p.name, score, champPick, voted, correct, wrong, accuracy };
  }).sort((a,b)=> 
    (b.score - a.score) ||
    (b.correct - a.correct) ||
    (b.voted - a.voted) ||
    (b.accuracy - a.accuracy)
  );

  const topScore = scored.length ? scored[0].score : 0;
  let html = `<div class="topbar"><button class="navbtn" id="backBtn">‹ المباريات</button><div class="brand" style="font-size:13px">📊 لوحة الترتيب</div>${state.isAdmin ? `<button class="navbtn" id="adminJump">🔒 لوحة الأدمن</button>` : ''}</div>
  <div class="banner">🏆 الترتيب يعتمد على النقاط، ثم عدد التوقعات الصحيحة، ثم عدد المباريات التي شارك فيها المتسابق. المباريات المحسومة حتى الآن: <b>${decidedMatches}</b></div>`;

  scored.forEach((p,i)=>{
    const flag = p.champPick ? TEAMS[p.champPick].flag : '❔';
    const medal = i===0 ? '🥇' : (i===1?'🥈':(i===2?'🥉':(i+1)));
    const title = i===0 ? 'المركز الأول' : (i===1?'المركز الثاني':(i===2?'المركز الثالث':''));
    const medalStyle = i===0
      ? 'border-color:#c99a1f;background:linear-gradient(100deg,#fff6d8,#ffe9a8);'
      : i===1
      ? 'border-color:#9aa5b1;background:linear-gradient(100deg,#f5f7f9,#e2e7ec);'
      : i===2
      ? 'border-color:#b8763f;background:linear-gradient(100deg,#fbe9dc,#f0cdaf);'
      : '';
    const cycleColors = ['#2563eb','#7c3aed','#ec4899','#14b8c4','#f59e0b','#dc2626'];
    const nameColor = i<3 ? 'var(--chalk)' : cycleColors[i % cycleColors.length];
    html += `<div class="lb-row" style="${medalStyle}">
      <div class="lb-rank">${medal}</div>
      <div class="lb-champ">${flag}</div>
      <div class="lb-name" style="color:${nameColor}">${escapeHtml(p.name)} ${title?`<div style="font-size:10px;color:var(--gold-deep);margin-top:2px">${title}</div>`:''}
        <div class="lb-stats">
          <span class="stat-pill">شارك: ${p.voted}</span>
          <span class="stat-pill good">صحيح: ${p.correct}</span>
          <span class="stat-pill bad">خطأ: ${p.wrong}</span>
          <span class="stat-pill">دقة: ${p.accuracy}%</span>
        </div>
      </div>
      <div class="lb-score">${p.score}<small> نقطة</small></div>
    </div>`;
  });

  html += `<div class="note">يتم تحديث هذه اللوحة تلقائيًا بعد اعتماد نتيجة كل مباراة من لوحة المشرف.</div>`;

  $app.innerHTML = html;
  document.getElementById('backBtn').onclick = ()=>{ state.view='matches'; render(); };
  if(document.getElementById('adminJump')){
    document.getElementById('adminJump').onclick = ()=>{ state.view='admin'; render(); };
  }
  if(actual['final'] && scored.length) burstCelebration(0.6);
}

/* ---------------- Final Champions (combined R16 + Knockout) ---------------- */
async function renderFinalChampions(){
  $app.innerHTML = `<div class="topbar"><button class="navbtn" id="backBtn">‹ المباريات</button><div class="brand" style="font-size:13px">🏆 الأبطال النهائيون</div>${state.isAdmin ? `<button class="navbtn" id="adminJump">🔒 لوحة الأدمن</button>` : ''}</div><div class="banner">جاري التحميل...</div>`;

  const actual = await getActual();
  const koScores = (await sget('ko-actual-scores', true)) || {};
  const r16Preds = (await getAllPredictions('predictions:')) || [];
  const koPreds = (await getAllPredictions('ko-predictions:')) || [];

  // أوزان الأدوار الإقصائية — مطابقة تمامًا لـ ROUND_WEIGHTS في knockout.html
  const KO_WEIGHTS = { qf1:2, qf2:2, qf3:2, qf4:2, sf1:4, sf2:4, third:3, final:8 };
  const EXACT_BONUS = 2;

  const byKey = {};
  r16Preds.forEach(p=>{
    const key = normalizeName(p.name);
    if(!byKey[key]) byKey[key] = { name: p.name, r16: 0, ko: 0, r16Voted:0, koVoted:0 };
    let pts = 0, voted = 0;
    MATCHES.forEach(m=>{
      const result = actual[m.id], pick = p.picks ? p.picks[m.id] : null;
      if(result && pick){ voted++; if(result === pick) pts += 1; }
    });
    byKey[key].r16 = pts;
    byKey[key].r16Voted = voted;
    byKey[key].name = p.name;
  });
  koPreds.forEach(p=>{
    const key = normalizeName(p.name);
    if(!byKey[key]) byKey[key] = { name: p.name, r16: 0, ko: 0, r16Voted:0, koVoted:0 };
    let pts = 0, voted = 0;
    Object.keys(KO_WEIGHTS).forEach(id=>{
      const result = actual[id], pick = p.picks ? p.picks[id] : null;
      if(result && pick){
        voted++;
        if(pick.winner === result){
          pts += KO_WEIGHTS[id];
          const sc = koScores[id];
          if(sc && String(sc.a) === String(pick.a) && String(sc.b) === String(pick.b)) pts += EXACT_BONUS;
        }
      }
    });
    byKey[key].ko = pts;
    byKey[key].koVoted = voted;
    byKey[key].name = p.name;
  });

  const combined = Object.values(byKey)
    .map(x => ({ ...x, total: x.r16 + x.ko }))
    .filter(x => x.r16Voted > 0 || x.koVoted > 0)
    .sort((a,b) => b.total - a.total);

  let html = `<div class="topbar"><button class="navbtn" id="backBtn">‹ المباريات</button><div class="brand" style="font-size:13px">🏆 الأبطال النهائيون</div>${state.isAdmin ? `<button class="navbtn" id="adminJump">🔒 لوحة الأدمن</button>` : ''}</div>`;
  html += `<div class="hof-hero">
      <div class="hof-hero-title">🏆 الأبطال النهائيون</div>
      <div class="hof-hero-sub">الترتيب الكلي — دور الـ16 + كل الأدوار الإقصائية معًا، أساس تحديد الفائزين الثلاثة</div>
    </div>`;
  html += `<div class="promo-card">
      <div class="promo-title">⭐ كيف تُحسب هذه النقاط؟</div>
      <div class="mini-box">
        ✔ دور الـ16 = <b>1 نقطة</b> لكل توقع صحيح.<br>
        ✔ ربع النهائي = <b>2 نقطة</b> لكل توقع صحيح.<br>
        ✔ نصف النهائي = <b>4 نقاط</b> لكل توقع صحيح.<br>
        ✔ تحديد المركز الثالث = <b>3 نقاط</b> لكل توقع صحيح.<br>
        ✔ النهائي = <b>8 نقاط</b> لكل توقع صحيح.<br>
        🎯 من ربع النهائي فما فوق: <b>+2 نقطة إضافية</b> عند توقع النتيجة بالأهداف بدقة تامة.<br>
        🥅 عند التعادل، الفائز يُحدَّد بركلات الترجيح — دون أي نقاط إضافية أو منقوصة بسبب ذلك.<br>
        🏆 <b>الرقم الظاهر هنا لكل شخص = مجموع دور الـ16 + كل الأدوار الإقصائية</b>، وهو ما يحدد فعليًا أصحاب المراكز الثلاثة الأولى.
      </div>
    </div>`;

  if(combined.length === 0){
    html += `<div class="empty-note">لا توجد مشاركات كافية بعد لعرض الترتيب الكلي.</div>`;
  } else {
    const medalBg = [
      'border-color:#c99a1f;background:linear-gradient(100deg,#fff6d8,#ffe9a8);',
      'border-color:#9aa5b1;background:linear-gradient(100deg,#f5f7f9,#e2e7ec);',
      'border-color:#b8763f;background:linear-gradient(100deg,#fbe9dc,#f0cdaf);'
    ];
    const cycleColors = ['#2563eb','#7c3aed','#ec4899','#14b8c4','#f59e0b','#dc2626'];
    combined.forEach((p,i)=>{
      const medal = i===0?'🥇':(i===1?'🥈':(i===2?'🥉':(i+1)));
      const style = i<3 ? medalBg[i] : '';
      const nameColor = i<3 ? 'var(--chalk)' : cycleColors[i % cycleColors.length];
      const title = i===0?'المركز الأول 🏆':(i===1?'المركز الثاني':(i===2?'المركز الثالث':''));
      html += `<div class="lb-row" style="${style}">
        <div class="lb-rank">${medal}</div>
        <div class="lb-name" style="color:${nameColor}">${escapeHtml(p.name)} ${title?`<div style="font-size:10px;color:var(--gold-deep);margin-top:2px">${title}</div>`:''}
          <div class="lb-stats">
            <span class="stat-pill">دور الـ16: ${p.r16}</span>
            <span class="stat-pill">الإقصائيات: ${p.ko}</span>
          </div>
        </div>
        <div class="lb-score">${p.total}</div>
      </div>`;
    });
  }

  $app.innerHTML = html;
  document.getElementById('backBtn').onclick = ()=>{ state.view='matches'; render(); };
  if(document.getElementById('adminJump')){
    document.getElementById('adminJump').onclick = ()=>{ state.view='admin'; render(); };
  }
  if(combined.length) burstCelebration(0.5);
}

/* ---------------- Admin panel ---------------- */
async function renderAdmin(){
  $app.innerHTML = `<div class="banner">جاري التحميل...</div>`;
  const actual = await getActual();
  const actualScores = (await sget('actual-scores', true)) || {};

  const allPreds = (await getAllPredictions('predictions:')) || [];
  const allIdentities = ((await getAllPredictions('identity:')) || []).sort((a,b)=>a.name.localeCompare(b.name,'ar'));

  function codesTableHtml(){
    const missingCount = allIdentities.filter(idn => !idn.code).length;
    const rows = allIdentities.map(idn =>
      `<tr><td style="padding:6px 8px;">${escapeHtml(idn.name)}</td><td style="padding:6px 8px; font-family:Oswald; color:var(--gold); font-weight:900;">${idn.code ? escapeHtml(idn.code) : '— (قديم بلا رمز)'}</td></tr>`
    ).join('');
    return `
      <details class="mini-box" style="margin-bottom:14px;">
        <summary style="cursor:pointer; font-weight:900;">🔑 الأسماء والرموز (${allIdentities.length}) — اضغط للعرض</summary>
        ${missingCount > 0 ? `<button class="btn btn-gold" id="backfillCodesBtn" style="margin:10px 0;">🔧 توليد رموز لكل من ليس لديه رمز (${missingCount})</button>` : ''}
        <table style="width:100%; margin-top:10px; font-size:13px;"><tbody>${rows}</tbody></table>
      </details>`;
  }

  function getVoteStats(matchId, winnerCode){
    const votes = {};
    Object.keys(TEAMS).forEach(code => votes[code] = []);
    allPreds.forEach(p=>{
      const pick = p.picks ? p.picks[matchId] : null;
      if(pick && votes[pick]) votes[pick].push(p.name);
    });
    const correct = winnerCode && votes[winnerCode] ? votes[winnerCode] : [];
    const wrong = [];
    if(winnerCode){
      allPreds.forEach(p=>{
        const pick = p.picks ? p.picks[matchId] : null;
        if(pick && pick !== winnerCode) wrong.push(p.name);
      });
    }
    return { votes, correct, wrong, total: allPreds.filter(p => p.picks && p.picks[matchId]).length };
  }

  let html = `
    <div class="topbar"><button class="navbtn" id="backBtn">‹ المباريات</button><div class="brand" style="font-size:13px">🔒 لوحة المشرف</div></div>
    ${codesTableHtml()}
    <div class="banner">سجّل النتيجة الرسمية بعد المباراة. التصويتات القديمة محفوظة ولن تتغير.</div>
    <div class="fieldwrap">
      <label>رفع لوجو البطولة / كأس العالم للخلفية المائية</label>
      <input type="file" id="logoFile" accept="image/*">
      <button class="btn btn-outline" id="clearLogoBtn">حذف اللوجو</button>
    </div>
  `;

  MATCHES.forEach(match=>{
    const teamA = resolvedTeam(actual, match, 'a');
    const teamB = resolvedTeam(actual, match, 'b');
    const result = actual[match.id];
    const score = actualScores[match.id] || {};
    html += `<div class="match-card"><div class="match-meta"><span>${ROUND_LABELS[match.round]} · ${match.venue}</span></div>`;

    if(!teamA || !teamB){
      html += `<div class="note">بانتظار نتائج الدور السابق</div>`;
    } else {
      const tA = TEAMS[teamA], tB = TEAMS[teamB];
      const stats = getVoteStats(match.id, result);

      html += `
        <div class="fieldwrap" style="padding:12px;margin-bottom:10px;">
          <label>النتيجة الرسمية</label>
          <div style="display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;margin-bottom:8px;">
            <div>${tA.flag} ${tA.name}</div>
            <input type="text" inputmode="numeric" class="score-input" data-match="${match.id}" data-side="a" value="${score.a ?? ''}" placeholder="0" style="text-align:center;">
            <div>${tB.flag} ${tB.name}</div>
            <input type="text" inputmode="numeric" class="score-input" data-match="${match.id}" data-side="b" value="${score.b ?? ''}" placeholder="0" style="text-align:center;">
          </div>
          <div class="note">اكتب النتيجة أولاً، ثم اختر الفائز، ثم اضغط زر حفظ/تحديث النتيجة. يمكنك تعديلها حتى نهاية المباراة.</div>
        </div>
      `;

      [['a',teamA],['b',teamB]].forEach(([side,code])=>{
        const t = TEAMS[code];
        const sel = result === code ? 'selected' : '';
        html += `<button class="team-row admin-pick ${sel}" data-match="${match.id}" data-pick="${code}">
          <span class="flag">${t.flag}</span><span class="name">${result === code ? '🏆 ' : ''}${t.name}</span>
        </button>`;
      });

      html += `<button class="btn btn-gold save-result-btn" data-match="${match.id}" data-current="${result || ''}">💾 حفظ / تحديث النتيجة</button>`;
      const votesA = stats.votes[teamA] || [];
      const votesB = stats.votes[teamB] || [];
      html += `
        <div class="fieldwrap compact-vote-summary">
          <label>ملخص التصويت</label>
          <div class="note" style="text-align:right">
            ${tA.flag} ${tA.name}: <b>${votesA.length}</b> تصويت<br>
            ${tB.flag} ${tB.name}: <b>${votesB.length}</b> تصويت<br>
            الإجمالي: <b>${stats.total}</b>
          </div>
        </div>
      `;

      if(result){
        html += `
          <div class="fieldwrap" style="padding:12px;margin-top:10px;border-color:var(--gold-deep);">
            <label>مطابقة التوقعات مع النتيجة</label>
            <div class="note" style="text-align:right">
              ✅ توقعوا صحيحًا (${stats.correct.length}):<br>
              <b>${stats.correct.length ? stats.correct.map(escapeHtml).join('، ') : 'لا يوجد'}</b><br><br>
              ❌ توقعوا خطأ (${stats.wrong.length}):<br>
              <b>${stats.wrong.length ? stats.wrong.map(escapeHtml).join('، ') : 'لا يوجد'}</b>
            </div>
          </div>
        `;
      }
    }
    html += `</div>`;
  });

  html += `
    <div class="fieldwrap danger-zone">
      <label>منطقة حساسة</label>
      <button class="btn btn-outline" id="showResetBtn">⚠️ إظهار خيار تصفير النتائج</button>
      <button class="btn btn-outline" id="resetActualBtn" style="display:none;border-color:#e2483d;color:#ffd9d9">♻️ تصفير كل النتائج الفعلية</button>
      <div class="note">لا تستخدم هذا الخيار إلا إذا أردت حذف نتائج المباريات المعتمدة فقط.</div>
    </div>
    <div class="round-header"><span class="lbl">إدارة التوقعات</span><div class="line"></div></div>
    <div id="predsList"></div>
  `;

  $app.innerHTML = html;
  document.getElementById('backBtn').onclick = ()=>{ state.view='matches'; render(); };
  if(document.getElementById('backfillCodesBtn')){
    document.getElementById('backfillCodesBtn').onclick = async ()=>{
      let count = 0;
      for(const idn of allIdentities){
        if(!idn.code){
          const key = normalizeName(idn.name);
          const newCode = String(Math.floor(100 + Math.random()*900));
          await sset(`identity:${key}`, { ...idn, code: newCode }, true);
          count++;
        }
      }
      toast(`تم توليد ${count} رمز جديد ✅`);
      renderAdmin();
    };
  }
  document.getElementById('showResetBtn').onclick = ()=>{
    document.getElementById('resetActualBtn').style.display = 'block';
    toast('ظهر زر التصفير. اضغطه فقط إذا كنت متأكدًا.');
  };
  document.getElementById('resetActualBtn').onclick = async ()=>{
    const ok = confirm('تحذير: سيتم تصفير كل النتائج الفعلية المعتمدة. التصويتات لن تُحذف. هل أنت متأكد؟');
    if(!ok) return;
    await sdel('actual-results', true);
    await sdel('actual-scores', true);
    toast('تم تصفير النتائج الفعلية فقط');
    renderAdmin();
  };

  document.getElementById('logoFile').onchange = e=>{
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(file.size > 450000){ toast('اختر صورة أصغر من 450KB'); return; }
    const reader = new FileReader();
    reader.onload = async () => {
      const settings = (await sget('settings', true)) || {};
      settings.logoDataUrl = reader.result;
      await sset('settings', settings, true);
      await applySavedLogo();
      toast('تم حفظ اللوجو كخلفية مائية ✅');
    };
    reader.readAsDataURL(file);
  };

  document.getElementById('clearLogoBtn').onclick = async ()=>{
    const settings = (await sget('settings', true)) || {};
    delete settings.logoDataUrl;
    await sset('settings', settings, true);
    document.documentElement.style.setProperty('--wc-logo-bg', 'none');
    toast('تم حذف اللوجو');
  };

  let pendingAdminWinner = {};
  $app.querySelectorAll('.admin-pick').forEach(btn=>{
    btn.onclick = ()=>{
      const matchId = btn.getAttribute('data-match');
      const pick = btn.getAttribute('data-pick');
      pendingAdminWinner[matchId] = pick;
      $app.querySelectorAll(`.admin-pick[data-match="${matchId}"]`).forEach(x=>x.classList.remove('selected'));
      btn.classList.add('selected');
      toast('تم اختيار الفائز مؤقتًا. اضغط حفظ/تحديث النتيجة لاعتمادها.');
    };
  });

  $app.querySelectorAll('.save-result-btn').forEach(btn=>{
    btn.onclick = async ()=>{
      const matchId = btn.getAttribute('data-match');
      const pick = pendingAdminWinner[matchId] || btn.getAttribute('data-current');
      if(!pick){ toast('اختر الفريق الفائز أولاً'); return; }

      const scores = (await sget('actual-scores', true)) || {};
      const aInput = $app.querySelector(`.score-input[data-match="${matchId}"][data-side="a"]`);
      const bInput = $app.querySelector(`.score-input[data-match="${matchId}"][data-side="b"]`);
      scores[matchId] = {
        a: aInput ? aInput.value.trim() : '',
        b: bInput ? bInput.value.trim() : '',
        winner: pick,
        savedAt: Date.now()
      };

      const a = await getActual();
      a[matchId] = pick;

      await sset('actual-results', a, true);
      await sset('actual-scores', scores, true);

      toast('✅ تم حفظ/تحديث النتيجة ومطابقة التوقعات');
      renderAdmin();
    };
  });

  /*

  */

  const idKeys = await slist('identity:', true);
  const r16Keys = await slist('predictions:', true);
  const koKeys = await slist('ko-predictions:', true);
  const allKeysSet = new Set([
    ...(idKeys || []).map(k => k.replace('identity:', '')),
    ...(r16Keys || []).map(k => k.replace('predictions:', '')),
    ...(koKeys || []).map(k => k.replace('ko-predictions:', ''))
  ]);
  const people = [];
  for(const key of allKeysSet){
    let name = key;
    const idn = await sget(`identity:${key}`, true);
    if(idn && idn.name) name = idn.name;
    else {
      const kp = await sget(`ko-predictions:${key}`, true);
      if(kp && kp.name) name = kp.name;
      else {
        const rp = await sget(`predictions:${key}`, true);
        if(rp && rp.name) name = rp.name;
      }
    }
    people.push({ key, name });
  }
  const list = document.getElementById('predsList');
  if(people.length===0){
    list.innerHTML = `<div class="empty-note">لا يوجد أسماء مسجّلة بعد.</div>`;
  } else {
    function participantDetailHtml(key){
      const pred = allPreds.find(p => normalizeName(p.name) === key);
      const picks = pred && pred.picks ? pred.picks : {};
      if(!Object.keys(picks).length) return `<div class="note" style="padding:10px 0;">لم يشارك في أي مباراة بعد.</div>`;
      const rows = MATCHES.map(m=>{
        const pick = picks[m.id];
        if(!pick) return '';
        const result = actual[m.id];
        const team = TEAMS[pick];
        let status = '⏳ لم تُحسم بعد';
        if(result) status = (result === pick) ? '✅ صحيح' : '❌ خطأ';
        return `<tr style="color:#1a2b4a;"><td style="padding:5px 8px;">${m.venue || m.id}</td><td style="padding:5px 8px;">${team ? team.flag+' '+team.name : pick}</td><td style="padding:5px 8px;">${status}</td></tr>`;
      }).join('');
      return `<table style="width:100%; font-size:12.5px; margin-top:8px;"><tbody>${rows}</tbody></table>`;
    }
    list.innerHTML = people.map(p=>`
      <div class="lb-row" style="flex-direction:column; align-items:stretch;">
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <div class="lb-name" style="cursor:pointer; text-decoration:underline dotted;" data-togglekey="${escapeHtml(p.key)}">${escapeHtml(p.name)}</div>
          <button class="navbtn" data-delkey="${escapeHtml(p.key)}" data-delname="${escapeHtml(p.name)}">حذف نهائيًا</button>
        </div>
        <div class="participant-detail" data-detailkey="${escapeHtml(p.key)}" style="display:none;"></div>
      </div>
    `).join('');
    list.querySelectorAll('[data-togglekey]').forEach(nameEl=>{
      nameEl.onclick = ()=>{
        const key = nameEl.getAttribute('data-togglekey');
        const detailEl = list.querySelector(`[data-detailkey="${CSS.escape(key)}"]`);
        const isOpen = detailEl.style.display !== 'none';
        list.querySelectorAll('.participant-detail').forEach(d=>d.style.display='none');
        if(!isOpen){ detailEl.innerHTML = participantDetailHtml(key); detailEl.style.display = 'block'; }
      };
    });
    list.querySelectorAll('[data-delkey]').forEach(btn=>{
      btn.onclick = async ()=>{
        const key = btn.getAttribute('data-delkey');
        const name = btn.getAttribute('data-delname');
        const ok = confirm(`تحذير: سيتم حذف "${name}" نهائيًا مع كل توقعاته (دور الـ16 والأدوار الإقصائية معًا). لا يمكن التراجع. هل أنت متأكد؟`);
        if(!ok) return;
        await sdel(`identity:${key}`, true);
        await sdel(`predictions:${key}`, true);
        await sdel(`ko-predictions:${key}`, true);
        toast(`تم حذف "${name}" نهائيًا من كل الأدوار`);
        renderAdmin();
      };
    });
  }
}

/* ---------------- Confetti / Fireworks ---------------- */
const canvas = document.getElementById('fx-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas(){ canvas.width = innerWidth; canvas.height = innerHeight; }
resizeCanvas(); addEventListener('resize', resizeCanvas);
let particles = [];
function spawnConfetti(n){
  const colors = ['#ffcc33','#f5f1e6','#2fbf71','#e2483d','#3aa0ff'];
  for(let i=0;i<n;i++){
    particles.push({type:'confetti', x:Math.random()*canvas.width, y:-20-Math.random()*200,
      vx:(Math.random()-0.5)*2, vy:2+Math.random()*3, size:5+Math.random()*5,
      color:colors[Math.floor(Math.random()*colors.length)], rot:Math.random()*360, vr:(Math.random()-0.5)*10, life:220});
  }
}
function spawnFirework(){
  const cx = canvas.width*(0.2+Math.random()*0.6), cy = canvas.height*(0.2+Math.random()*0.35);
  const color = ['#ffcc33','#e2483d','#2fbf71','#3aa0ff','#f5f1e6'][Math.floor(Math.random()*5)];
  const count = 40;
  for(let i=0;i<count;i++){
    const angle = (Math.PI*2*i)/count, speed = 2+Math.random()*3;
    particles.push({type:'spark', x:cx, y:cy, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
      size:2+Math.random()*2, color, life:60+Math.random()*20, alpha:1});
  }
}
let fxRunning = false;
function fxLoop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    if(p.type==='confetti'){
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; p.life--;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle=p.color; ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size*0.6); ctx.restore();
    } else if(p.type==='spark'){
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.05; p.life--; p.alpha=Math.max(0,p.life/70);
      ctx.globalAlpha=p.alpha; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fillStyle=p.color; ctx.fill(); ctx.globalAlpha=1;
    }
  });
  particles = particles.filter(p=>p.life>0 && p.y<canvas.height+40);
  if(particles.length>0) requestAnimationFrame(fxLoop);
  else { fxRunning=false; ctx.clearRect(0,0,canvas.width,canvas.height); }
}
function burstCelebration(scale=1){
  spawnConfetti(Math.floor(90*scale));
  let fired=0; const n=Math.max(2,Math.floor(4*scale));
  const iv=setInterval(()=>{ spawnFirework(); fired++; if(fired>=n) clearInterval(iv); }, 350);
  if(!fxRunning){ fxRunning=true; requestAnimationFrame(fxLoop); }
}
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
init();
</script>
